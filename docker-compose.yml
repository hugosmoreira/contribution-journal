services:
  postgres:
    image: postgres:17-alpine
    container_name: journal-postgres
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal_dev
      POSTGRES_DB: journal
    ports:
      - "5544:5432"
    volumes:
      - journal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  journal_pgdata:
